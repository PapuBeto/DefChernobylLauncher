name: Build launcher

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Generar iconos
        run: npm run icon

      - name: Compilar instalador
        run: npm run dist -- --publish never

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: chernobylz-setup
          path: dist/*.exe
          retention-days: 14

  release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Generar iconos
        run: npm run icon

      - name: Compilar y publicar instalador
        run: npm run dist -- --publish onTag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: chernobylz-setup
          path: dist/*.exe
          retention-days: 14
